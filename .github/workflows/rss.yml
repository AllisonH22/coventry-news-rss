name: Update Coventry RSS Feed

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Generate RSS feed
        run: |
          python generate_feed.py

      - name: Send email notification
        if: success()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_P: ${{ secrets.SMTP_P }}
          TEST_RECIPIENT: ${{ secrets.TEST_RECIPIENT }}
        run: |
          python send_news_email.py

      - name: Save updated feed and email state
        run: |
          git config user.name "Coventry RSS Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml last_sent.txt

          if git diff --cached --quiet; then
            echo "No changes to feed.xml or last_sent.txt"
          else
            git commit -m "Update Coventry news RSS feed"
            git push
          fi
